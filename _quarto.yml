project:
  type: website
  render:
    - index.qmd
    - pages/handwriting-ai.qmd
    - pages/handwriting-ai-prompts.qmd
    - pages/handskrift-ki.qmd
    - pages/handskrift-ki-prompter.qmd
    - pages/logarithms-ai.qmd
    - pages/logaritmer-ki.qmd
  # Fetched by the page script (fill-in buttons and prompt sandbox).
  resources:
    - assets/handskrift/answers.json
    - assets/handskrift/student*/*.png
    - assets/logaritmer/answers.json
    - assets/logaritmer/student*/*.png
    - feedback/*/*.yml

lang: en

filters:
  - path: _extensions/ctm-assessment/tab-ids.lua
    at: pre-ast
  - _filters/example-source.lua
  - ctm-assessment

website:
  title: "Freehand AI assessment"
  sidebar:
    style: docked
    contents:
      - text: "Physics: practice exam V2025"
        file: pages/handwriting-ai.qmd
      - text: "Mathematics: logarithms V24"
        file: pages/logarithms-ai.qmd
      - text: "Playing with the prompts"
        file: pages/handwriting-ai-prompts.qmd
      - section: "Bokmål"
        contents:
          - text: "Fysikk: prøveeksamen V2025"
            file: pages/handskrift-ki.qmd
          - text: "Matematikk: logaritmer V24"
            file: pages/logaritmer-ki.qmd
          - text: "Spill med promptene"
            file: pages/handskrift-ki-prompter.qmd

format:
  html:
    theme: cosmo
    css: styles.css

ai-feedback:
  mode: api

ctm-assessment:
  markdown-lint: true
