project:
  type: website
  render:
    - index.qmd
    - pages/handwriting-ai.qmd
    - pages/handwriting-ai-prompts.qmd
    - pages/handskrift-ki.qmd
    - pages/handskrift-ki-prompter.qmd
  # Fetched by the page script (fill-in buttons and prompt sandbox).
  resources:
    - assets/handskrift/student1/*.png
    - assets/handskrift/student2/*.png
    - feedback/handskrift/*.yml
    - feedback/handwriting/*.yml

lang: en

filters:
  - path: _extensions/ctm-assessment/tab-ids.lua
    at: pre-ast
  - ctm-assessment

website:
  title: "Freehand AI assessment"
  sidebar:
    style: docked
    contents:
      - text: "Practice exam V2025"
        file: pages/handwriting-ai.qmd
      - text: "Playing with the prompts"
        file: pages/handwriting-ai-prompts.qmd
      - text: "Prøveeksamen V2025 (bokmål)"
        file: pages/handskrift-ki.qmd
      - text: "Spill med promptene (bokmål)"
        file: pages/handskrift-ki-prompter.qmd

format:
  html:
    theme: cosmo
    css: styles.css

ai-feedback:
  mode: api

ctm-assessment:
  markdown-lint: true
