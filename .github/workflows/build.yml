name: Build and publish

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: "1.8.27"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # SymPy: the version Pyodide ships, so build-time checks match the browser.
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt sympy==1.13.3
      - name: Install Quarto extensions
        run: python scripts/setup.py
      - name: Render website
        run: quarto render
      - name: Save rendered website
        uses: actions/upload-artifact@v7
        with:
          name: site
          path: _site

  # Pull requests are built and checked, but only main is published.
  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: pages-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: site
          path: _site
      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
